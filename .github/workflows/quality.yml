name: Review checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify code
        env:
          DOCX_VERIFY_GENERATION: "1"
        run: npm run verify
      - name: Build all pages
        run: npm run build
